[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "src-guard"
version = "0.2.0"
description = "Professional source code security auditing tool"
authors = [
    { name = "Exprr" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pathspec>=0.11.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
src-guard = "src_guard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
